spring.application.name=slop-jumpers-api
server.port=${PORT:8092}
# Keep the existing H2 filename so native installs reopen their saved runs.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/slop-jumper;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_CONNECTIONS:8}
spring.datasource.hikari.connection-timeout=${DATABASE_WAIT_MS:1500}
spring.datasource.hikari.validation-timeout=1000
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
slop-jumpers.workshop-token=${WORKSHOP_TOKEN:local-workshop}
slop-jumpers.leaderboard-workers=${LEADERBOARD_WORKERS:2}
slop-jumpers.leaderboard-queue=${LEADERBOARD_QUEUE:8}
slop-jumpers.leaderboard-deadline-ms=${LEADERBOARD_DEADLINE_MS:1500}
slop-jumpers.seed-size=${SEED_SIZE:0}
